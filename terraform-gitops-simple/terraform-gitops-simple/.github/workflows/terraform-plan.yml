###############################################################################
# .github/workflows/terraform-plan.yml
# Trigger : every Pull Request targeting main
# Purpose : Run terraform fmt, validate, plan — post results as PR comment
###############################################################################

name: "🔍 Terraform Plan"

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  pull-requests: write   # needed to post the plan comment

env:
  TF_VERSION: "1.8.0"
  AWS_REGION:  "us-east-1"

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      # ── 2. Setup Terraform ───────────────────────────────────────────────
      - name: "⚙️  Setup Terraform ${{ env.TF_VERSION }}"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── 3. Configure AWS credentials ─────────────────────────────────────
      - name: "🔑 Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 4. Terraform Format check ────────────────────────────────────────
      - name: "🎨 Terraform Format Check"
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      # ── 5. Terraform Init ────────────────────────────────────────────────
      - name: "🔧 Terraform Init"
        id: init
        run: terraform init -input=false

      # ── 6. Terraform Validate ────────────────────────────────────────────
      - name: "✅ Terraform Validate"
        id: validate
        run: terraform validate -no-color

      # ── 7. Terraform Plan ────────────────────────────────────────────────
      - name: "📋 Terraform Plan"
        id: plan
        run: |
          terraform plan \
            -var-file="environments/dev/dev.tfvars" \
            -no-color \
            -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      # ── 8. Post plan as PR comment ───────────────────────────────────────
      - name: "💬 Post Plan to PR"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('plan_output.txt', 'utf8');
            const truncated = planOutput.length > 60000
              ? planOutput.substring(0, 60000) + '\n\n... output truncated ...'
              : planOutput;

            const fmtStatus  = '${{ steps.fmt.outcome }}';
            const initStatus = '${{ steps.init.outcome }}';
            const valStatus  = '${{ steps.validate.outcome }}';
            const planStatus = '${{ steps.plan.outcome }}';

            const emoji = (s) => s === 'success' ? '✅' : '❌';

            const body = `## 🤖 Terraform Plan Results

            | Step | Status |
            |------|--------|
            | Format  | ${emoji(fmtStatus)}  \`${fmtStatus}\`  |
            | Init    | ${emoji(initStatus)} \`${initStatus}\` |
            | Validate| ${emoji(valStatus)}  \`${valStatus}\`  |
            | Plan    | ${emoji(planStatus)} \`${planStatus}\` |

            <details><summary>📄 Show Plan Output</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            *Triggered by @${{ github.actor }} on \`${{ github.ref }}\`*
            *Workflow: \`${{ github.workflow }}\` | Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      # ── 9. Fail if plan failed ───────────────────────────────────────────
      - name: "🚨 Fail if plan failed"
        if: steps.plan.outcome == 'failure'
        run: exit 1
