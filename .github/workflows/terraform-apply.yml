###############################################################################
# .github/workflows/terraform-apply.yml
# Trigger : push to main (i.e. after PR is merged)
# Purpose : Run terraform apply automatically — true GitOps style
###############################################################################

name: "🚀 Terraform Apply"

on:
  push:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  issues:   write    # for auto GitHub Issue on failure

env:
  TF_VERSION: "1.8.0"
  AWS_REGION:  "us-east-1"

jobs:
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      # ── 2. Setup Terraform ───────────────────────────────────────────────
      - name: "⚙️  Setup Terraform ${{ env.TF_VERSION }}"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── 3. Configure AWS credentials ─────────────────────────────────────
      - name: "🔑 Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 4. Terraform Init ────────────────────────────────────────────────
      - name: "🔧 Terraform Init"
        run: terraform init -input=false

      # ── 5. Terraform Plan (pre-apply confirmation) ────────────────────────
      - name: "📋 Terraform Plan"
        run: |
          terraform plan \
            -var-file="environments/dev/dev.tfvars" \
            -no-color \
            -out=tfplan

      # ── 6. Terraform Apply ───────────────────────────────────────────────
      - name: "🚀 Terraform Apply"
        id: apply
        run: |
          terraform apply \
            -auto-approve \
            -no-color \
            tfplan 2>&1 | tee apply_output.txt

      # ── 7. Print outputs ─────────────────────────────────────────────────
      - name: "📤 Show Terraform Outputs"
        if: steps.apply.outcome == 'success'
        run: terraform output

      # ── 8. Open GitHub Issue on failure ──────────────────────────────────
      - name: "🐛 Open Issue on Apply Failure"
        if: steps.apply.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('apply_output.txt', 'utf8');
            const truncated = output.length > 10000
              ? output.substring(0, 10000) + '\n... truncated ...'
              : output;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 Terraform Apply FAILED — ${new Date().toISOString().split('T')[0]}`,
              body: `## Terraform Apply Failure

              **Commit:** \`${{ github.sha }}\`
              **Actor:**  @${{ github.actor }}
              **Run:**    [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

              <details><summary>Error Output</summary>

              \`\`\`
              ${truncated}
              \`\`\`

              </details>`,
              labels: ['terraform', 'bug', 'infrastructure']
            });

      - name: "🚨 Fail job on apply error"
        if: steps.apply.outcome == 'failure'
        run: exit 1
